name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Create Release Tarball
        run: tar -czf bitchord-monochrome-addon-${{ github.ref_name }}.tar.gz dist/ package.json package-lock.json LICENSE README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: bitchord-monochrome-addon-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
